# render.yaml — Render Blueprint definition for Cloud VM Intelligence Cockpit
#
# Place this file at the REPO ROOT so Render's Blueprint feature can discover it.
#
# Memory tier: SQL-native startup path keeps peak memory ~350MB → free tier (512MB) viable.
#
# To deploy:
#   1. Connect this GitHub repo in the Render dashboard -> "New Blueprint Instance"
#   2. Render will read this file and create the web service + Redis automatically.
#   3. In Render dashboard, set KAGGLE_USERNAME and KAGGLE_KEY (from kaggle.com/settings/account).
#   4. After deploy, set CORS_ORIGINS to your Vercel frontend URL in Render dashboard.
#   5. Set VITE_API_BASE_URL in Vercel to this service's onrender.com URL.

services:
  - type: web
    name: cloud-vm-cockpit-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: REDIS_URL
        fromService:
          name: cloud-vm-cockpit-redis
          type: redis
          property: connectionString
      - key: CORS_ORIGINS
        value: https://your-vercel-app.vercel.app
      - key: WASTE_POWER_THRESHOLD
        value: "375.14"
      - key: POWER_ALERT_KW
        value: "400000.0"
      - key: KAGGLE_USERNAME
        sync: false
      - key: KAGGLE_KEY
        sync: false

  - type: redis
    name: cloud-vm-cockpit-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []
